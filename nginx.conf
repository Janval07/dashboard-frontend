worker_processes auto;
events { worker_connections 1024; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log /var/log/nginx/access.log combined;
  sendfile on;
  server_tokens off;
  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Content-Security-Policy. connect-src debe incluir las URLs de .env
    # (VITE_KEYCLOAK_URL y VITE_API_URL); si cambian, actualizar aqui.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:8081 http://localhost:8001; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Los navegadores solo la aplican sobre HTTPS; se deja lista para cuando haya TLS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    location / { try_files $uri $uri/ /index.html; }
  }
}